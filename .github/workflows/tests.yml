name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['9.0.x', '10.0.x']
        include:
          - dotnet-version: '9.0.x'
            framework: net9.0
          - dotnet-version: '10.0.x'
            framework: net10.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --framework ${{ matrix.framework }}

      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release
          --framework ${{ matrix.framework }}
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/examples/**"
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[Didww.Api3.Examples]*"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:./coverage/**/coverage.cobertura.xml \
            -targetdir:./coverage/report \
            -reporttypes:"Html;Badges;TextSummary"

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(grep 'Line coverage' ./coverage/report/Summary.txt | grep -oP '\d+\.?\d*' | head -1)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Generate and commit coverage badge
        if: github.ref == 'refs/heads/main' && matrix.dotnet-version == '10.0.x'
        run: |
          COVERAGE="${{ steps.coverage.outputs.percentage }}"
          if [ -z "$COVERAGE" ]; then
            COVERAGE="0"
          fi
          if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            COLOR="yellowgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > .github/badges/coverage.svg

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --cached --quiet || git commit -m "Update coverage badge: ${COVERAGE}%" && git push
